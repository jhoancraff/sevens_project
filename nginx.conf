server {
    listen 80;
    server_name localhost;

    # La app sube el Excel de ingredientes (public/plantilla_ingredientes.xlsx)
    # a /api/admin/ingredientes/importar/. El default de Nginx (1m) lo cortaria.
    client_max_body_size 20m;

    # Frontend (React SPA)
    location / {
        root /home/sevens/sevens_project/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Assets del build (JS/CSS hasheados) con cache larga
    location /assets/ {
        root /home/sevens/sevens_project/frontend/dist;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Service worker y manifest de la PWA: deben servirse sin cache larga
    # para que el navegador detecte actualizaciones.
    location = /sw.js {
        root /home/sevens/sevens_project/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        root /home/sevens/sevens_project/frontend/dist;
        default_type application/manifest+json;
    }

    # Backend API (Django + Gunicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Files
    location /static/ {
        alias /home/sevens/sevens_project/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
